name: Android CI

# 触发条件：push 到 main/master/develop 分支，或提交 PR
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    # 在 Ubuntu 最新版上运行
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码仓库
    - name: 检出代码仓库
      uses: actions/checkout@v4

    # 2. 配置 Java 17 (Temurin 发行版)
    - name: 配置 Java 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. 配置 Android SDK 36
    - name: 配置 Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36

    # 4. 执行 Gradle 构建 (Debug 版本)
    - name: 构建 Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # 5. 运行单元测试
    - name: 运行单元测试
      run: ./gradlew testDebugUnitTest --stacktrace

    # 6. 执行 lint 代码检查
    - name: 执行 Lint 检查
      run: ./gradlew lintDebug --stacktrace

    # 7. 上传构建产物（即使构建失败也上传）
    - name: 上传构建产物
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-outputs
        path: app/build/outputs/

    # 8. 上传测试报告
    - name: 上传测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/

    # 9. 上传 lint 报告
    - name: 上传 Lint 报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: app/build/reports/lint-results/
